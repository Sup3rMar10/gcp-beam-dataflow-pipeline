name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install apache-beam pytest pyyaml
      - run: python -m pytest
      - name: Run the pipeline over the sample file
        run: python -m payments_beam batch

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
